---
# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - type: http
    repo_owner: mdekstrand
    repo_name: guarsh
    url: https://codeberg.org/mdekstrand/rust-jim/releases/download/v{{.Version}}/guartcl-{{.Version}}-{{.Arch}}-{{.OS}}.tgz
    description: Rust Jim interpreter
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-gnu
  - type: http
    repo_owner: mdekstrand
    repo_name: copytree
    url: https://codeberg.org/mdekstrand/copytree/releases/download/v{{.Version}}/copytree-{{.Version}}-{{.Arch}}-{{.OS}}.tgz
    description: Rust Jim interpreter
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-gnu
  - type: github_release
    repo_owner: kaaveland
    repo_name: thumper
    asset: thumper-{{.Arch}}-{{.OS}}
    format: raw
    replacements:
      amd64: x86_64
      arm64: aarch64
      darwin: apple-darwin
      linux: unknown-linux-musl
      windows: pc-windows-gnu
    overrides:
      - goos: windows
        asset: thumper-{{.Arch}}-{{.OS}}.exe
    supported_envs:
      - darwin
      - linux
      - windows/amd64
